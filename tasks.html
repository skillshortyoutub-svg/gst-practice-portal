<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice Tasks - GST Practice Portal</title><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap"><div class="card"><h2>Practice Tasks for Students</h2><p>Each task says which <b>demo login</b> to use (password <code>Demo@1234</code>), the steps, and an answer key (click "Show answer"). Use <a href="#" onclick="resetDemo();return false">Reset demo data</a> to start fresh. All data is fictional.</p><div id="T"></div></div></div>
<script src="common.js"></script><script src="sample.js"></script><script src="demo.js"></script><script>layout();
const T=[
['Registration','New registration end-to-end','none (Register)',['Home &gt; Register. Fill Part A (PAN, email, mobile) and verify OTPs to get a TRN.','Use the TRN to fill all 10 tabs of Part B and submit with EVC → ARN.','Track Application Status &gt; act as officer &gt; Approve → GSTIN and temporary password.','Login &gt; First time login with GSTIN + temporary password; create username/password.'],'You should see an ARN (starts with AA + state code), then a 15-character GSTIN whose 13th character is 1, 14th is Z and 15th is the check digit.'],
['GSTR-1','File monthly GSTR-1 with B2B, B2C and a credit note','demo_monthly',['Returns Dashboard &gt; select the latest month (Sep) &gt; GSTR-1 PREPARE ONLINE.','Records are pre-filled. Add one more B2B invoice to a sample GSTIN (e.g. one from Search Taxpayer) at 18%.','Look at Table 12 — HSN is split into B2B and B2C tabs.','Tick declaration and file with EVC.'],'Table 12 B2B tab includes Tables 4A/9B rows; B2C tab includes Table 5/7 rows. After filing you get an ARN and the status changes to Filed.'],
['GSTR-3B','File a late GSTR-3B and see interest + late fee','demo_monthly',['Notice the Dashboard: GSTR-3B of August is pending.','Returns Dashboard &gt; August &gt; GSTR-3B. Table 3.1 is auto-drafted from GSTR-1.','Enter ITC in Table 4 (from GSTR-2B), save, then Proceed to payment.','Check Table 6.1: interest = cash tax × 18% × days late ÷ 365; late fee ₹25/day CGST + ₹25/day SGST (₹10 each for nil), capped at ₹1,000 each for turnover up to ₹1.5 Cr.','Create challan for the shortfall, pay, offset, file.'],'Example: cash tax ₹20,000 paid 40 days late → interest ₹20,000×0.18×40/365 = ₹394.52. Late fee for 40 days = ₹1,000 CGST + ₹1,000 SGST (capped).'],
['GSTR-2B','Match ITC with GSTR-2B','demo_monthly',['Returns &gt; GSTR-2A / 2B for August.','Generate GSTR-2B. One supplier invoice was filed on the 17th (after the 11th cut-off).','Copy 2B ITC to GSTR-3B Table 4.'],'The invoice filed on the 17th shows in 2A but moves to the NEXT month\'s 2B (cut-off: 11th for monthly GSTR-1, 13th for IFF/quarterly).'],
['QRMP','Quarter end for a QRMP taxpayer','demo_qrmp',['Returns Dashboard &gt; Jul-Sep quarter. IFF for July and August is already filed and PMT-06 paid.','File quarterly GSTR-1 for September (only Sep invoices, as Jul/Aug went in IFF).','File GSTR-3B (quarterly). PMT-06 deposits already sit in the cash ledger and are used first.'],'GSTR-1 due 13th and GSTR-3B due 22nd/24th of the month after the quarter. Cash ledger balance from PMT-06 reduces the extra cash needed.'],
['Composition','File CMP-08','demo_comp',['Returns Dashboard &gt; Jul-Sep 2026 &gt; CMP-08.','Enter outward turnover, e.g. ₹8,00,000. Tax for a trader = 1% (0.5% CGST + 0.5% SGST).','Pay and file.'],'₹8,00,000 × 1% = ₹8,000 (₹4,000 CGST + ₹4,000 SGST). Composition dealers cannot collect tax or claim ITC.'],
['Payments','Create and pay a challan; check ledgers','any demo',['Payments &gt; Create Challan, enter ₹5,000 CGST tax and ₹5,000 SGST tax, choose E-Payment.','Pay it. Note CPIN (14 digits), CIN and BRN.','Electronic Ledgers: cash ledger balance increases by ₹10,000.'],'CPIN is valid for 15 days. Over-the-counter payment is limited to ₹10,000 per challan.'],
['e-Invoice','Generate IRN and test the 30-day rule','demo_large',['e-Invoice: AATO is ₹10 Cr+. Generate IRN for a pending Sep invoice.','Try a manual invoice dated 40 days ago.','Try cancelling an IRN (allowed within 24 hours).'],'The 40-day-old invoice is blocked: from 1 Apr 2025, taxpayers with AATO ≥ ₹10 crore cannot report documents older than 30 days (GSTN advisory, 5 Nov 2024).'],
['e-Way Bill','Update Part B and extend validity','demo_large',['e-Way Bill: one EWB has Part B pending — update vehicle no. KA01XY9999.','Check validity: 980 km → 5 days (1 day per 200 km or part).','Try extending an EWB within 8 hours before/after expiry.'],'980/200 = 4.9 → 5 days. Without Part B the goods cannot move.'],
['Refund','Refund of excess cash ledger balance','any demo (monthly has advance deposit)',['Refunds &gt; Application for Refund &gt; Excess balance in cash ledger.','Claim ₹2,000 IGST (not more than the balance).','File with EVC; see cash ledger debited; approve as officer in My Applications.'],'Cash ledger IGST tax balance reduces by ₹2,000 at filing (RFD-01 debit). RFD-02 acknowledgment, then RFD-06 sanction order.'],
['LUT & export refund','File LUT and compute export refund','demo_large',['Refunds &gt; LUT: LUT for FY 2026-27 is already filed — try filing again (blocked).','Refund &gt; Export without payment of tax: zero-rated turnover ₹10,00,000, adjusted total turnover ₹25,00,000, net ITC ₹1,20,000.'],'Max refund = 10,00,000 × 1,20,000 ÷ 25,00,000 = ₹48,000.'],
['Registration','Core and non-core amendments','any demo',['Registration &gt; Amendment (Core): change PPOB address; submit; approve as officer (REG-15).','Amendment (Non-Core): change mobile/trade name — auto-approved.'],'Core fields (legal name, PPOB, partners) need officer approval; non-core changes are approved immediately.'],
['Cancellation','Cancel and revoke registration','demo_comp (or reset afterwards)',['Registration &gt; Cancellation (REG-16): reason closure, stock ₹1,00,000 @ 5%.','Approve as officer → status becomes Cancelled (REG-19). File GSTR-10.','Registration &gt; Revocation (REG-21) → approve (REG-22) → Active.','Reset demo data at the end.'],'Tax on stock = ₹5,000. GSTR-10 must be filed within 3 months of cancellation.'],
['TDS / TCS','Accept TCS credit','demo_large',['Returns &gt; TDS and TCS Credit Received: accept the pending TCS from the e-commerce operator.','Open Electronic Ledgers — cash ledger CGST/SGST tax increased.','Try GSTR-8: supplies ₹2,00,000 intra-State.'],'TCS on ₹2,00,000 @ 0.5% = ₹1,000 (₹500 CGST + ₹500 SGST). TDS under GSTR-7 is 2% where contract value exceeds ₹2.5 lakh.'],
['Annual','GSTR-9, late fee and GSTR-9C','demo_large',['Returns &gt; Annual Return (GSTR-9) for FY 2025-26 (due 31 Dec 2026).','Enter turnover; read the late fee slab.','GSTR-9C: reconcile audited turnover with GSTR-9.'],'AATO above ₹20 Cr: ₹100 + ₹100 per day, max 0.25% + 0.25% of State turnover. Up to ₹5 Cr: ₹25 + ₹25, max 0.02% + 0.02%; ₹5-20 Cr: ₹50 + ₹50, max 0.02% + 0.02% (Notification 07/2023-CT).'],
['ITC-04','Report goods sent to job worker','demo_qrmp',['Returns &gt; ITC-04: add Table 4 entry (fabric sent), then 5A (received back).','File.'],'Inputs must return within 1 year (capital goods 3 years). Half-yearly if AATO > ₹5 Cr, else annual (due 25 April).'],
['Notices','Reply to a scrutiny notice','any demo',['User Services &gt; View Notices and Orders: open the ASMT-10.','Reply with an explanation of the ITC difference.'],'Status changes to Replied. On the real portal the reply is in ASMT-11.']];
$('T').innerHTML=T.map((t,i)=>`<div class="card task"><h3>Task ${i+1}: ${t[1]} <small>(${t[0]})</small></h3><p>Login: <b>${t[2]}</b>${t[2].startsWith('demo_')?` <button class="btn s" onclick="demoLogin('${t[2].slice(5)}')">DEMO LOGIN</button>`:''}</p><ol>${t[3].map(s=>`<li>${s}</li>`).join('')}</ol><details><summary><b>Show answer</b></summary><p>${t[4]}</p></details></div>`).join('')</script></body></html>
